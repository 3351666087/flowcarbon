# Local development and single-host deployment.
#   docker compose -f infra/docker-compose.yml up -d db                    # database only (for `npm run dev:*`)
#   docker compose -f infra/docker-compose.yml --profile app up -d --build # full stack on :3000 (web) and :4000 (API)
#   DEMO_PASSWORD=... docker compose -f infra/docker-compose.yml --profile demo run --rm seed   # simulated tower
#   docker compose -f infra/docker-compose.yml --profile pump up -d pump          # keep the simulated tower live
#   DOMAIN=fc.example.org docker compose -f infra/docker-compose.yml --profile app --profile edge up -d   # HTTPS on :443
# Published ports bind to 127.0.0.1 unless *_BIND says otherwise; only the edge proxy listens publicly.
# Settings come from the environment or an .env file next to this one; see .env.example at the repository root.
name: flowcarbon

x-server: &server
  image: ghcr.io/3351666087/flowcarbon-server:${FLOWCARBON_VERSION:-local}
  build: { context: .., target: server }
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }

x-app-db: &app-db postgres://flowcarbon_app:${APP_DB_PASSWORD:-flowcarbon-app-dev}@db:5432/flowcarbon

services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowcarbon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowcarbon-dev}
      POSTGRES_DB: flowcarbon
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-flowcarbon-app-dev}
      TIMESCALEDB_TELEMETRY: "off"
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
    mem_limit: ${DB_MEM_LIMIT:-1g}
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowcarbon -d flowcarbon"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: [app, demo, pump]
    image: ghcr.io/3351666087/flowcarbon-server:${FLOWCARBON_VERSION:-local}
    build: { context: .., target: server }
    command: ["node", "migrate.mjs"]
    environment:
      DATABASE_MIGRATION_URL: postgres://flowcarbon:${POSTGRES_PASSWORD:-flowcarbon-dev}@db:5432/flowcarbon
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *server
    profiles: [app]
    command: ["node", "api.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: *app-db
      PORT: "4000"
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
      APP_URL: ${PUBLIC_URL:-http://localhost:3000}
      # set to true when the site is served over HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # outgoing mail (sign-in and reset codes, invitations) through an SMTP relay
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    mem_limit: ${API_MEM_LIMIT:-512m}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-4000}:4000"

  worker:
    <<: *server
    profiles: [app]
    command: ["node", "worker.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: *app-db
      HEALTH_PORT: "4100"
      HEALTH_URL_PORT: "4100"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
    mem_limit: ${WORKER_MEM_LIMIT:-512m}

  web:
    profiles: [app]
    image: ghcr.io/3351666087/flowcarbon-web:${FLOWCARBON_VERSION:-local}
    build:
      context: ..
      target: web
      args: { API_ORIGIN: "http://api:4000" }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"

  seed:
    profiles: [demo]
    image: ghcr.io/3351666087/flowcarbon-server:${FLOWCARBON_VERSION:-local}
    build: { context: .., target: server }
    command: ["node", "seed.mjs", "--reset"]
    environment:
      DATABASE_URL: *app-db
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}  # empty: a random password is printed once
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  # keeps the simulated tower live: simulates the elapsed part of each day and ingests it (run the seed first)
  pump:
    profiles: [pump]
    image: ghcr.io/3351666087/flowcarbon-server:${FLOWCARBON_VERSION:-local}
    build: { context: .., target: server }
    command: ["node", "pump.mjs"]
    healthcheck:
      disable: true # no HTTP server to probe; the log shows each run
    environment:
      DATABASE_URL: *app-db
      PUMP_INTERVAL_MINUTES: ${PUMP_INTERVAL_MINUTES:-15}
    mem_limit: ${PUMP_MEM_LIMIT:-384m}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # HTTPS for a single host: automatic certificates for DOMAIN, the API and the web app behind one origin
  edge:
    profiles: [edge]
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}  # the public host name
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./download:/srv/download:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: ${EDGE_MEM_LIMIT:-128m}
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
